<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="imagens/favicon-32x32.png" type="image/x-icon">
  <title>Product Preview Card</title>
  <link rel="stylesheet" href="estilo/style.css">
</head>
<body>

<main class="card">

  <div class="image">
    <img src="imagens/image-product-mobile.jpg" alt="Perfume Gabrielle Essence">
  </div>

  <div class="content">
    
    <p class="category">P E R F U M E</p>

    <h1>Gabrielle Essence Eau De Parfum</h1>

    <p class="description">
      A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.
    </p>

    <div class="price">
      <span class="current">$149.99</span>
      <span class="old">$169.99</span>
    </div>

    <button>
      <img src="imagens/icon-cart.svg" alt="icon cart">
      Add to Cart
    </button>

  </div>

</main>

</body>
</html>
